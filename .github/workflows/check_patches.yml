name: Check patches

# 补丁必须能干净地套到官方最新稳定版上 (这是 Harmony Release 实际编译的版本).
# 同时试套官方 main, 提前发现即将到来的冲突; main 冲突只警告, 不算失败.

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/check_patches.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/check_patches.yml'
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Optional: verify the APK artifact from this Harmony Release run'
        required: false
        type: string
      harmony_version:
        description: 'Expected APK version, e.g. 6.3.0-harmony.1'
        required: false
        type: string

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  UPSTREAM_REPO: open-ani/animeko

jobs:
  apply:
    name: Apply to ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: latest stable
            ref: latest
            required: true
          - name: main
            ref: main
            required: false
    continue-on-error: ${{ !matrix.target.required }}

    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: ref
        env:
          TARGET_REF: ${{ matrix.target.ref }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_REF" == "latest" ]]; then
            ref="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')"
          else
            ref="$TARGET_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing against $UPSTREAM_REPO@$ref"

      - name: Fetch official source
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: git clone --depth 1 --branch "$REF" "https://github.com/$UPSTREAM_REPO.git" "$RUNNER_TEMP/animeko"

      - name: Apply patches
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # prepare-source.sh 只接受稳定版 tag; 对 main 用一个占位 tag 走同样的流程.
          tag="$REF"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || tag="v0.0.0"
          scripts/prepare-source.sh "$RUNNER_TEMP/animeko" "$tag" 1
          {
            echo "### Patches applied to \`$UPSTREAM_REPO@$REF\`"
            echo
            echo '```'
            git -C "$RUNNER_TEMP/animeko" log --oneline -n 5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify_existing_artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      HARMONY_VERSION: ${{ inputs.harmony_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$HARMONY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-harmony\.[0-9]+$ ]]
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          name: animeko-harmony-v${{ env.HARMONY_VERSION }}
          path: artifact-dir
      - name: Verify APK package, version, ABI, manifest, and signature
        run: bash scripts/verify-apk.sh artifact-dir "$HARMONY_VERSION"
